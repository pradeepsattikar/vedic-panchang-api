[project]
name = "vedic-panchang-api"
version = "0.1.0"
description = "Open-source, deterministic Vedic Panchang calculation API (Tithi, Nakshatra, Yoga, Karana, sunrise/sunset, Rahu Kalam, Muhurta) built on the Swiss Ephemeris."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Pradeep Sattikar" }]
requires-python = ">=3.12"
keywords = ["panchang", "vedic", "hindu calendar", "tithi", "nakshatra", "swiss ephemeris", "jyotish"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Religion",
    "Programming Language :: Python :: 3.12",
    "Topic :: Religion",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "fastapi>=0.115",
    "pyswisseph>=2.10.3.2",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.30",
]

[project.urls]
Repository = "https://github.com/pradeepsattikar/vedic-panchang-api"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vedic_panchang"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
