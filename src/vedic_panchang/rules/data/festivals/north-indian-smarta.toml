# Festival rules: North Indian (Purnimanta display), Smarta observance.
#
# Months are AMANTA (new moon to new moon). For Krishna-paksha dates the North Indian
# (Purnimanta) name is the following month: e.g. Diwali is "Kartika Amavasya" in the North
# but amanta_month = "ashwin" here.
# tithi: 1-15 Shukla (15 = Purnima), 16-30 Krishna (30 = Amavasya).
# kala: part of the day the Tithi must prevail in (see rules/festivals.py).
# tie: day chosen when the Tithi prevails in the kala on two days. Defaults: "first" for
#      sunrise/moonrise, "max_coverage" otherwise.
# If the Tithi prevails in the kala on neither day, the day it prevails at sunrise is used.
# avoid_bhadra: time under Bhadra (Vishti karana) does not count towards the kala.
#
# short_name: label for tight spaces such as calendar cells (at most ~12 characters).
#
# Any change here MUST bump rule_version.

rule_version = "2026.10.2"

