# Calculation profiles.
#
# A profile bundles every convention that can differ between traditions. Changing any
# value here MUST bump `rule_version`, because cached results and API responses are keyed
# and labelled by it.
#
# A profile may say `inherits = "<other profile>"` and list only the values that differ;
# nested tables (day_periods) are merged key by key.
#
# Day-period tables: the daytime (sunrise -> sunset) is split into 8 equal parts; the
# number is the 1-based part for that weekday. Verified against Drik Panchang (2026-10-10).

default_profile = "north-indian-smarta"

[profiles.north-indian-smarta]
name = "North Indian (Purnimanta), Smarta observance"
rule_version = "2026.10.3"  # 2026-10-18: Graha positions with mean Rahu/Ketu (Drik default)
ayanamsha = "lahiri"
month_system = "purnimanta"
festival_convention = "smarta"
day_anchor = "sunrise"
festival_set = "north-indian-smarta"  # rules/data/festivals/<set>.toml
shubh_set = "north-indian-smarta"     # rules/data/shubh/<set>.toml
muhurta_set = "north-indian-smarta"   # rules/data/muhurta/<set>.toml

# Weekdays on which Abhijit Muhurta is avoided (reported as not applicable).
# Wednesday: matches Drik Panchang, confirmed by the founder 2026-10-12 (D08).
abhijit_excluded_weekdays = ["wednesday"]

# Rahu and Ketu from the mean lunar node ("mean"), as Drik Panchang shows by default; or "true".
lunar_node = "mean"

# The Vikram Samvat year starts at Chaitra Shukla Pratipada ("chaitra", North India) or at
# Kartika Shukla Pratipada, the day after Diwali ("kartika", Maharashtra and Gujarat).
vikram_year_start = "chaitra"

[profiles.north-indian-smarta.day_periods.rahu_kalam]
monday = 2
tuesday = 7
wednesday = 5
thursday = 6
friday = 4
saturday = 3
sunday = 8

[profiles.north-indian-smarta.day_periods.yamaganda]
monday = 4
tuesday = 3
wednesday = 2
thursday = 1
friday = 7
saturday = 6
sunday = 5

[profiles.north-indian-smarta.day_periods.gulika_kalam]
monday = 6
tuesday = 5
wednesday = 4
thursday = 3
friday = 2
saturday = 1
sunday = 7

# Maharashtrian Panchang (founder, 2026-10-26): Amanta months (a month ends at Amavasya), as in
# Date Panchang and Kalnirnay. Everything else (Lahiri, sunrise day, Rahu Kalam tables,
# Abhijit, Graha positions, Shubh Yogas, Muhurat) is the same as the North Indian profile.
# Festival dates follow the same Tithi rules; only month names in Krishna Paksha differ.
[profiles.maharashtrian-smarta]
inherits = "north-indian-smarta"
name = "Maharashtrian (Amanta), Smarta observance"
rule_version = "2026.10.2"  # 2026-10-28: Vikram year starts at Kartika (Kalnirnay)
month_system = "amanta"
# Kalnirnay 2026 (founder's page): "शके १९४८, पराभवनाम संवत्सर, विक्रम संवत २०८२" in October.
vikram_year_start = "kartika"
# Temporary: the North Indian festival list until the founder-reviewed Maharashtrian list
# (rules/data/festivals/maharashtrian-smarta.toml) is built. See
# notes/design_2026-10-26_panchang_styles_and_marathi.md in the project folder.
festival_set = "north-indian-smarta"
